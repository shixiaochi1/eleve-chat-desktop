# Weather Pipeline Configuration
app:
  name: "Weather Data Pipeline"
  version: "1.0.0"
  debug: false

data_source:
  api_url: "https://api.weather.example.com"
  api_key: "demo-key-12345"
  timeout: 30
  retry_count: 3

processing:
  batch_size: 100
  temperature_unit: "celsius"
  enable_cache: true
  cache_ttl: 3600

storage:
  type: "json"
  output_dir: "./output"
  max_file_size_mb: 10

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/pipeline.log"
