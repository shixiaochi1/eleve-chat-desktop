# Eleve Agent 默认配置模板
# 首次启动时，eleved bootstrap 会在 data/ 目录生成实际 config.yaml
# 此文件仅供开发参考，不包含真实凭证

agent:
  max_turns: 90
  streaming: true

auxiliary:
  approval:
    provider: auto
    timeout: 30
  compression:
    provider: auto
    timeout: 120
  curator:
    provider: auto
    timeout: 600
  kanban_decomposer:
    provider: auto
    timeout: 180
  mcp:
    provider: auto
    timeout: 30
  profile_describer:
    provider: auto
    timeout: 60
  session_search:
    provider: auto
    timeout: 30
  skills_hub:
    provider: auto
    timeout: 30
  title_generation:
    provider: auto
    timeout: 30
  triage_specifier:
    provider: auto
    timeout: 120
  vision:
    provider: auto
    timeout: 120
  web_extract:
    provider: auto
    timeout: 360

# === Model Configuration ===
# 首次启动时，eleved onboarding 会引导用户配置 provider
# 或在设置面板中配置
# model:
#   provider: "your-provider"
#   default: "your-model"

providers:
  openai:
    name: OpenAI
    transport: openai_chat
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    key_env: OPENAI_API_KEY
  # 示例：添加自定义 provider
  # my-provider:
  #   name: 我的 Provider
  #   transport: openai_chat
  #   base_url: https://api.example.com/v1
  #   model: my-model
  #   api_key: sk-xxx  # 或使用 key_env: MY_API_KEY

server:
  host: 127.0.0.1
  port: 0  # 0 = 自动分配空闲端口

shell:
  active: ""  # 空 = 自动发现

# === Agent Configuration ===
agent:
  max_turns: 90
  streaming: true

# === Timezone Configuration ===
# IANA 时区字符串（如 Asia/Shanghai、America/New_York）。
# 影响 execute_code 沙箱内 datetime.now() 的墙钟时间（注入 TZ 环境变量）。
# 留空/注释 = 使用系统时区。也可在 设置 → 聊天 → 时区 中修改（per-profile 生效）。
# timezone: "Asia/Shanghai"

# === Memory Configuration ===
memory:
  enabled: true
  user_profile_enabled: true
  memory_dir: ""  # 留空 = 使用 ELEVE_HOME/memories/
  nudge_interval: 10
  flush_min_turns: 6

# === Session 治理 Configuration ===
# 常驻会话生命周期治理（per-Agent 生效，也可在 设置 → 高级 → 会话治理 中修改）
sessions:
  idle_ttl_secs: 3600     # 闲置驱逐间隔（秒）：空闲超过此时间且非忙碌的会话移出内存（数据已落盘可恢复）。0 = 禁用自动驱逐
  max_live_sessions: 1000 # 常驻会话上限：内存中最多驻留的会话数，超限驱逐最久未活跃。0 = 不限制
