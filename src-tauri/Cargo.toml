[package]
name = "eleve-chat-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
portable-pty = "0.8"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
# 画布插件化 S5（2026-08-18）：image_ops 搬入需要 HTTP 下载/base64/multipart
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
regex = "1"
arboard = "3"
window-vibrancy = "0.8.0"
windows-version = "0.1.7"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
